<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Google Ads</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls input,
        .controls select,
        .controls button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }

        .controls input,
        .controls select {
            background: white;
            color: #333;
            min-width: 200px;
        }

        .controls button {
            background: #ff6b6b;
            color: white;
            font-weight: 600;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #ff5252;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .metric-card .label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .metric-card .unit {
            color: #999;
            font-size: 0.85em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-container h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3em;
        }

        .campaigns-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .campaigns-table h3 {
            padding: 25px;
            background: #f8f9fa;
            color: #333;
            font-size: 1.3em;
            margin: 0;
            border-bottom: 1px solid #e9ecef;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #667eea;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        th {
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody td {
            color: #333;
        }

        .error {
            background: #ffe0e0;
            color: #c92a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .controls input,
            .controls select {
                min-width: 100%;
            }

            table {
                font-size: 0.85em;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Google Ads</h1>
            <p>Metriche campagne pubblicitarie in tempo reale</p>
        </div>

        <div class="controls">
            <select id="daysSelect">
                <option value="7">Ultimi 7 giorni</option>
                <option value="30">Ultimi 30 giorni</option>
                <option value="90">Ultimi 90 giorni</option>
            </select>
            <button onclick="loadDashboard()">🔄 Aggiorna</button>
        </div>

        <div id="errorContainer"></div>
        <div id="loadingContainer" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Caricamento dati...</p>
        </div>

        <div id="contentContainer">
            <div class="metrics-grid" id="metricsGrid"></div>
            <div class="charts-grid">
                <div class="chart-container">
                    <h3>Impressioni vs Click</h3>
                    <canvas id="impressionsClicksChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Costo per Campagna</h3>
                    <canvas id="costChart"></canvas>
                </div>
            </div>
            <div class="campaigns-table">
                <h3>📋 Dettagli Campagne</h3>
                <table id="campaignsTable">
                    <thead>
                        <tr>
                            <th>Campagna</th>
                            <th>Impressioni</th>
                            <th>Click</th>
                            <th>CTR</th>
                            <th>Costo</th>
                            <th>CPC</th>
                            <th>Conversioni</th>
                        </tr>
                    </thead>
                    <tbody id="campaignsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let chartsInstances = {};

        async function loadDashboard() {
            const days = document.getElementById('daysSelect').value;
            const errorContainer = document.getElementById('errorContainer');
            const loadingContainer = document.getElementById('loadingContainer');
            const contentContainer = document.getElementById('contentContainer');

            errorContainer.innerHTML = '';
            loadingContainer.style.display = 'block';
            contentContainer.style.opacity = '0.5';

            try {
                const response = await fetch(`${API_URL}/summary?days=${days}`);

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'Errore nel caricamento dei dati');
                }

                const data = result.data;
                renderMetrics(data);
                renderCharts(data);
                renderTable(data.campaigns);

            } catch (error) {
                console.error('Error:', error);
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>⚠️ Errore:</strong> ${error.message}<br>
                        <small>Verifica che il server API sia in esecuzione su http://localhost:3000</small>
                    </div>
                `;
                contentContainer.style.display = 'none';
            } finally {
                loadingContainer.style.display = 'none';
                contentContainer.style.opacity = '1';
            }
        }

        function renderMetrics(data) {
            const metricsGrid = document.getElementById('metricsGrid');
            metricsGrid.innerHTML = `
                <div class="metric-card">
                    <div class="label">Impressioni</div>
                    <div class="value">${formatNumber(data.totalImpressions)}</div>
                </div>
                <div class="metric-card">
                    <div class="label">Click</div>
                    <div class="value">${formatNumber(data.totalClicks)}</div>
                </div>
                <div class="metric-card">
                    <div class="label">CTR</div>
                    <div class="value">${data.averageCTR.toFixed(2)}<span class="unit">%</span></div>
                </div>
                <div class="metric-card">
                    <div class="label">Costo Totale</div>
                    <div class="value">€${data.totalCost.toFixed(2)}</div>
                </div>
                <div class="metric-card">
                    <div class="label">CPC</div>
                    <div class="value">€${data.averageCPC.toFixed(2)}</div>
                </div>
                <div class="metric-card">
                    <div class="label">Conversioni</div>
                    <div class="value">${formatNumber(data.totalConversions)}</div>
                </div>
            `;
        }

        function renderCharts(data) {
            const campaigns = data.campaigns.slice(0, 5);
            const names = campaigns.map(c => c.name);
            const impressions = campaigns.map(c => c.impressions);
            const clicks = campaigns.map(c => c.clicks);
            const costs = campaigns.map(c => c.cost);

            renderImpressionsClicksChart(names, impressions, clicks);
            renderCostChart(names, costs);
        }

        function renderImpressionsClicksChart(names, impressions, clicks) {
            const ctx = document.getElementById('impressionsClicksChart').getContext('2d');

            if (chartsInstances.impressionsClicks) {
                chartsInstances.impressionsClicks.destroy();
            }

            chartsInstances.impressionsClicks = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: names,
                    datasets: [
                        {
                            label: 'Impressioni',
                            data: impressions,
                            backgroundColor: '#667eea',
                            borderRadius: 8,
                        },
                        {
                            label: 'Click',
                            data: clicks,
                            backgroundColor: '#764ba2',
                            borderRadius: 8,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        },
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                        },
                    },
                },
            });
        }

        function renderCostChart(names, costs) {
            const ctx = document.getElementById('costChart').getContext('2d');

            if (chartsInstances.cost) {
                chartsInstances.cost.destroy();
            }

            chartsInstances.cost = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: names,
                    datasets: [
                        {
                            data: costs,
                            backgroundColor: [
                                '#667eea',
                                '#764ba2',
                                '#f093fb',
                                '#4facfe',
                                '#00f2fe',
                            ],
                            borderColor: '#fff',
                            borderWidth: 2,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        },
                    },
                },
            });
        }

        function renderTable(campaigns) {
            const tbody = document.getElementById('campaignsBody');
            tbody.innerHTML = campaigns
                .map(
                    campaign => `
                <tr>
                    <td><strong>${campaign.name}</strong></td>
                    <td>${formatNumber(campaign.impressions)}</td>
                    <td>${formatNumber(campaign.clicks)}</td>
                    <td>${campaign.ctr}</td>
                    <td>€${campaign.cost.toFixed(2)}</td>
                    <td>€${campaign.cpc}</td>
                    <td>${formatNumber(campaign.conversions)}</td>
                </tr>
            `
                )
                .join('');
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('it-IT').format(Math.round(num));
        }

        document.getElementById('daysSelect').addEventListener('change', loadDashboard);

        // Load dashboard on page load
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
