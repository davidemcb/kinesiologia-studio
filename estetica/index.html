<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheda Estetica</title>
<meta name="description" content="Prototipo: scheda cliente per il centro estetico con anamnesi, foto, lettura della pelle e piano di lavoro.">
<meta name="robots" content="noindex">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F1EE; --surface: #FFFFFF; --ink: #2B2522; --muted: #6E615B; --line: #E4D9D3;
  --brand: #8A4F5E; --brand-ink: #FFF6F3; --brand-soft: #F2E2E4; --brand-strong: #6D3A48;
  --accent: #C98632; --accent-soft: #F7E9D5; --ok: #3E7A5E; --ok-soft: #E1EFE7;
  --danger: #AC4530; --danger-soft: #F4E2DC; --warn: #9A6B14; --warn-soft: #F7EBCF;
  --font-body: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif; --font-display: 'Fraunces', Georgia, serif;
  --shadow: 0 2px 12px rgba(60, 30, 30, .08); --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1B1618; --surface: #251F21; --ink: #EDE5E1; --muted: #A79892; --line: #3A3033;
  --brand: #C98A9A; --brand-ink: #2A1A1F; --brand-soft: #3A2A30; --brand-strong: #E0A7B5;
  --accent: #DFA24C; --accent-soft: #3C3022; --ok: #79B694; --ok-soft: #22352B;
  --danger: #E07B63; --danger-soft: #3A241E; --warn: #E0B35A; --warn-soft: #3A3120; --shadow: 0 2px 12px rgba(0,0,0,.4);
} }
:root[data-theme="dark"] {
  --bg: #1B1618; --surface: #251F21; --ink: #EDE5E1; --muted: #A79892; --line: #3A3033;
  --brand: #C98A9A; --brand-ink: #2A1A1F; --brand-soft: #3A2A30; --brand-strong: #E0A7B5;
  --accent: #DFA24C; --accent-soft: #3C3022; --ok: #79B694; --ok-soft: #22352B;
  --danger: #E07B63; --danger-soft: #3A241E; --warn: #E0B35A; --warn-soft: #3A3120; --shadow: 0 2px 12px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0 0 .4em; line-height: 1.15; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; } h4 { font-size: 1rem; font-family: var(--font-body); }
p { margin: 0 0 .8em; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); } .small { font-size: .85rem; }

header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
header.top h1 { font-size: 1.15rem; margin: 0; flex: 1; min-width: 160px; }
header.top h1 span { color: var(--muted); font-family: var(--font-body); font-weight: 400; font-size: .8rem; margin-left: 6px; }
main { max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { background: var(--brand-strong); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: .85rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card h2 { display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

.steps { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
.steps button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; color: var(--muted); }
.steps button.on { background: var(--brand-soft); color: var(--brand-strong); border-color: var(--brand); font-weight: 600; }
.steps button .n { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: var(--ink); font-size: .75rem; text-align: center; line-height: 20px; margin-right: 6px; }
.steps button.on .n { background: var(--brand); color: var(--brand-ink); }
.steps button.done .n { background: var(--ok); color: #fff; }

.q { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.q:last-child { border-bottom: 0; }
.q label.t { display: block; font-weight: 500; margin-bottom: 6px; }
.q label.t .req { color: var(--danger); }
.q input[type=text], .q input[type=number], .q select, .q textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.q textarea { min-height: 72px; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 14px; color: var(--muted); }
.seg button.on { background: var(--brand); color: var(--brand-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: .9rem; color: var(--ink); }
.chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-strong); font-weight: 500; }
.chip.sm { padding: 3px 9px; font-size: .8rem; }
.scala { display: flex; gap: 6px; }
.scala button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); }
.scala button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

.foto-slot { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px; text-align: center; background: var(--bg); position: relative; }
.foto-slot img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; display: block; }
.foto-slot .ph { aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 6px; }
.foto-slot .ph svg { width: 42px; height: 42px; opacity: .5; }
.foto-slot input { display: none; }
.foto-slot .lab { font-weight: 600; margin-top: 8px; }
.foto-slot .guida { font-size: .8rem; color: var(--muted); }
.foto-slot .x { position: absolute; top: 14px; right: 14px; }

.alert { border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; border: 1px solid transparent; }
.alert.danger { background: var(--danger-soft); border-color: var(--danger); }
.alert.warn { background: var(--warn-soft); border-color: var(--warn); }
.alert.ok { background: var(--ok-soft); border-color: var(--ok); }
.alert.info { background: var(--brand-soft); border-color: var(--brand); }
.alert b { display: block; }
.alert ul { margin: 4px 0 0; padding-left: 18px; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.ines { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg); }
.ines.off { opacity: .55; }
.ines .nome { font-weight: 600; }
.ines .evid { font-size: .88rem; color: var(--muted); margin: 4px 0 6px; }
.badge { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: .75rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.badge.ai { background: var(--accent-soft); color: var(--warn); }
.badge.man { background: var(--brand-soft); color: var(--brand-strong); }
.badge.viso { background: var(--ok-soft); color: var(--ok); }
.badge.corpo { background: var(--brand-soft); color: var(--brand-strong); }
.badge.conf-alta { background: var(--ok-soft); color: var(--ok); } .badge.conf-media { background: var(--warn-soft); color: var(--warn); } .badge.conf-bassa { background: var(--danger-soft); color: var(--danger); }

table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
.tess { display: inline-block; background: var(--accent-soft); color: var(--warn); border-radius: 6px; padding: 1px 7px; font-size: .78rem; margin: 1px 2px 1px 0; }

details.seduta { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--bg); }
details.seduta summary { padding: 10px 14px; cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.seduta summary::-webkit-details-marker { display: none; }
details.seduta .body { padding: 0 14px 12px; }
.fase { display: grid; grid-template-columns: 120px 1fr; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: .92rem; }
.fase .fn { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
.fase .tn { font-weight: 600; }
.fase .td { color: var(--muted); font-size: .85rem; }
.fase .caut { color: var(--warn); font-size: .8rem; font-weight: 600; }

.lista-schede .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lista-schede .item:last-child { border-bottom: 0; }
.vuoto { text-align: center; color: var(--muted); padding: 30px 10px; }

dialog { border: 0; border-radius: var(--r); padding: 20px; max-width: 480px; width: calc(100% - 32px); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); margin-bottom: 10px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; }
.footer-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }

@media (max-width: 560px) { .fase { grid-template-columns: 1fr; gap: 2px; } main { padding: 12px 16px 80px; } }
@media print {
  header.top, .steps, .no-print, .footer-nav, .toast { display: none !important; }
  body { background: #fff; color: #000; font-size: 12px; }
  main { max-width: none; padding: 0; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; page-break-inside: avoid; }
  details.seduta { break-inside: avoid; } details.seduta .body { display: block !important; }
  details.seduta:not([open]) .body { display: block; }
  .print-only { display: block !important; }
}
.print-only { display: none; }

/* esame al tatto */
details.prova { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--bg); }
details.prova summary { padding: 10px 14px; cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.prova summary::-webkit-details-marker { display: none; }
details.prova summary .scelto { color: var(--ok); font-weight: 600; }
details.prova .body { padding: 0 12px 12px; }
details.prova .come { background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.opz { display: grid; grid-template-columns: auto 1fr; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; color: var(--ink); align-items: start; }
.opz.on { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.opz img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
.opz .nome { font-weight: 600; }

/* fotocamera guidata */
dialog.camera { max-width: 560px; width: calc(100% - 16px); padding: 12px; }
.cam-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.cam-stage { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; border-radius: 12px; overflow: hidden; }
.cam-stage video, .cam-stage img, .cam-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam-stage video { object-fit: cover; } .cam-stage video.specchio { transform: scaleX(-1); }
.cam-stage img { object-fit: cover; opacity: .35; pointer-events: none; }
.cam-stage svg { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 2; pointer-events: none; }
.cam-stage svg text { fill: rgba(255,255,255,.9); stroke: none; font-size: 11px; text-anchor: middle; font-family: var(--font-body); }
.livella { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(0,0,0,.55); color: #fff; font-size: .78rem; padding: 3px 10px; border-radius: 999px; }
.livella:empty { display: none; } .livella.ok { background: rgba(62,122,94,.85); }
.cam-azioni { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
.btn-scatto { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--brand); background: var(--brand-ink); box-shadow: inset 0 0 0 3px var(--brand); }
.btn-scatto:active { transform: scale(.94); }
.cam-img { width: 100%; border-radius: 12px; display: block; }
.avvisi { margin: 8px 0 0; padding: 8px 10px 8px 26px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: .85rem; text-align: left; }
.avvisi.grave { background: var(--danger-soft); color: var(--danger); }
.foto-slot.grave { border-color: var(--danger); }
.confronto { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.confronto figure { margin: 0; } .confronto img { width: 100%; border-radius: 8px; display: block; } .confronto figcaption { font-size: .78rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header class="top">
  <h1>Scheda Estetica <span>prototipo</span></h1>
  <button class="btn sm" id="btn-elenco">Schede</button>
  <button class="btn sm primary" id="btn-nuova">+ Nuova</button>
  <button class="btn sm" id="btn-impostazioni" title="Impostazioni">⚙</button>
</header>
<main id="app"><div class="vuoto">Caricamento…</div></main>
<div class="toast" id="toast"></div>

<dialog id="dlg-camera" class="camera">
  <div class="cam-top">
    <div><b id="cam-titolo"></b><div class="small muted" id="cam-guida"></div></div>
    <button class="btn sm" id="cam-chiudi">✕</button>
  </div>
  <div id="cam-live">
    <div class="cam-stage">
      <video id="cam-video" playsinline muted autoplay></video>
      <img id="cam-ghost" alt="">
      <svg id="cam-sagoma" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="cam-livella" class="livella"></div>
    </div>
    <div class="row between" style="margin-top:8px">
      <span class="small muted" id="cam-info"></span>
      <label class="row small" id="cam-ghost-ctrl" style="display:none">precedente <input type="range" id="cam-ghost-op" min="0" max="80" value="35" style="width:90px"></label>
    </div>
    <div class="cam-azioni">
      <button class="btn" id="cam-galleria">Galleria</button>
      <button class="btn-scatto" id="cam-scatta" aria-label="Scatta"></button>
      <button class="btn" id="cam-gira">Gira</button>
    </div>
  </div>
  <div id="cam-anteprima" style="display:none">
    <img id="cam-img" alt="anteprima" class="cam-img">
    <div id="cam-avvisi"></div>
    <div class="cam-azioni">
      <button class="btn" id="cam-rifai">Rifai</button>
      <button class="btn primary" id="cam-usa">Usa questa foto</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-impostazioni">
  <h3>Impostazioni</h3>
  <p class="small muted">Indirizzo del worker che analizza le foto (cartella <code>worker/</code>). Senza, la lettura della pelle si compila a mano.</p>
  <label class="small">URL del worker</label>
  <input id="imp-url" type="url" placeholder="https://estetica-analisi.tuo-account.workers.dev">
  <label class="small">Chiave di accesso (se impostata nel worker)</label>
  <input id="imp-token" type="password" placeholder="facoltativa">
  <label class="small">Nome del centro (sulla stampa)</label>
  <input id="imp-centro" type="text" placeholder="Centro estetico …">
  <div class="row between">
    <button class="btn" id="imp-chiudi">Chiudi</button>
    <button class="btn primary" id="imp-salva">Salva</button>
  </div>
</dialog>

<script type="module">
import { generaPiano, valutaAnamnesi } from './motore.js';

/* ---------- stato ---------- */
const S = { kb: null, an: null, es: null, schede: [], scheda: null, step: 0, vista: 'elenco', analisi: false };
const SLOT_FOTO = [
  { id: 'viso_frontale', area: 'viso', nome: 'Viso frontale', max: 2048, sagoma: 'ovale', cosa: 'viso intero di fronte, a riposo', guida: 'Struccata e detersa da 15 minuti, capelli indietro, luce diffusa frontale, sguardo in camera, espressione rilassata. Il viso riempie l’ovale.' },
  { id: 'viso_sx', area: 'viso', nome: 'Profilo sinistro', max: 2048, sagoma: 'profilo', cosa: 'profilo sinistro, testa dritta', guida: 'Testa dritta, sguardo all’orizzonte, orecchio visibile. Dieci gradi di mento in su o in giù cambiano tutto: usa la sagoma.' },
  { id: 'viso_dx', area: 'viso', nome: 'Profilo destro', max: 2048, sagoma: 'profilo', cosa: 'profilo destro, testa dritta', guida: 'Stessa distanza e stessa altezza del profilo sinistro.' },
  { id: 'viso_mimica', area: 'viso', nome: 'Mimica', max: 2048, sagoma: 'ovale', facoltativa: true, cosa: 'viso di fronte con sopracciglia alzate e sorriso: rughe d’espressione', guida: 'Sopracciglia alzate e sorriso ampio: fa emergere le rughe d’espressione che a riposo non si vedono.' },
  { id: 'viso_dettaglio', area: 'viso', nome: 'Ravvicinato', max: 2048, sagoma: 'dettaglio', facoltativa: true, cosa: 'ravvicinato di guancia e ala del naso: pori, grana, capillari', guida: 'A 15-20 centimetri su guancia e ala del naso, a fuoco. Serve per pori, grana e capillari.' },
  { id: 'corpo_fronte', area: 'corpo', nome: 'Corpo di fronte', max: 1600, sagoma: 'corpo', cosa: 'figura intera di fronte', guida: 'Intimo neutro, piedi sul segno a terra, braccia un po’ aperte, muscoli rilassati. Telefono verticale all’altezza dell’ombelico, a circa 2,5 metri.' },
  { id: 'corpo_retro', area: 'corpo', nome: 'Corpo di spalle', max: 1600, sagoma: 'corpo', cosa: 'figura intera di spalle', guida: 'Stessa distanza e altezza. Glutei e cosce rilassati: è la vista principale per la cellulite.' },
  { id: 'corpo_lato', area: 'corpo', nome: 'Corpo di lato', max: 1600, sagoma: 'corpo_lato', cosa: 'figura intera di lato', guida: 'Postura naturale, non trattenere la pancia, braccia leggermente avanti.' },
  { id: 'corpo_pizzicotto', area: 'corpo', nome: 'Pizzicotto', max: 1600, sagoma: 'dettaglio', facoltativa: true, cosa: 'coscia o gluteo pizzicati fra pollice e indice: cellulite allo stadio iniziale', guida: 'Pizzica la pelle della coscia fra pollice e indice e fotografa da 30 centimetri. Fa emergere la cellulite che in piedi non si vede.' }
];
const STEP = ['Anamnesi', 'Foto', 'Lettura', 'Piano'];
const imp = () => { try { return JSON.parse(localStorage.getItem('estetica.impostazioni') || '{}'); } catch { return {}; } };

/* ---------- IndexedDB ---------- */
const db = {
  open() { return new Promise((ok, ko) => { const r = indexedDB.open('estetica', 1); r.onupgradeneeded = () => r.result.createObjectStore('schede', { keyPath: 'id' }); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  async tutte() { const d = await this.open(); return new Promise((ok, ko) => { const r = d.transaction('schede').objectStore('schede').getAll(); r.onsuccess = () => ok(r.result.sort((a, b) => (b.aggiornata || '').localeCompare(a.aggiornata || ''))); r.onerror = () => ko(r.error); }); },
  async salva(s) { const d = await this.open(); return new Promise((ok, ko) => { const t = d.transaction('schede', 'readwrite'); t.objectStore('schede').put(s); t.oncomplete = ok; t.onerror = () => ko(t.error); }); },
  async elimina(id) { const d = await this.open(); return new Promise((ok, ko) => { const t = d.transaction('schede', 'readwrite'); t.objectStore('schede').delete(id); t.oncomplete = ok; t.onerror = () => ko(t.error); }); }
};

/* ---------- utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'html') e.innerHTML = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); } for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k)); return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function ridimensiona(src, max = 1280) {
  const bmp = src instanceof ImageBitmap ? src : await createImageBitmap(src);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return { dataUrl: c.toDataURL('image/jpeg', .85), w: c.width, h: c.height, canvas: c };
}

/* Controllo di qualità della foto: luce, nitidezza, dominante di colore, ombre laterali.
   Soglie empiriche su una copia a 256 px: sono avvisi, non verdetti. */
function valutaFoto(canvas, slot) {
  const W = 256, H = Math.round(canvas.height * W / canvas.width);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(canvas, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data;
  const g = new Float32Array(W * H);
  let luma = 0, r = 0, b = 0, sx = 0, dx = 0, nSx = 0, nDx = 0;
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const l = .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2];
    g[p] = l; luma += l; r += d[i]; b += d[i + 2];
    if ((p % W) < W / 2) { sx += l; nSx++; } else { dx += l; nDx++; }
  }
  const n = W * H; luma /= n; r /= n; b /= n; sx /= nSx; dx /= nDx;
  let lap = 0, lap2 = 0, m = 0;
  for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) {
    const p = y * W + xx; const v = 4 * g[p] - g[p - 1] - g[p + 1] - g[p - W] - g[p + W];
    lap += v; lap2 += v * v; m++;
  }
  const nitidezza = lap2 / m - (lap / m) ** 2;
  const avvisi = [];
  if (luma < 55) avvisi.push({ t: 'Troppo buia: avvicinati a una finestra o accendi la ring light.', grave: true });
  else if (luma < 80) avvisi.push({ t: 'Poca luce: macchie e rossori si leggono male.' });
  if (luma > 205) avvisi.push({ t: 'Sovraesposta: la pelle è bruciata dalla luce.', grave: true });
  if (nitidezza < 20) avvisi.push({ t: 'Mossa o sfocata: tieni fermo il telefono e rimetti a fuoco.', grave: true });
  else if (nitidezza < 50 && slot.sagoma === 'dettaglio') avvisi.push({ t: 'Poco nitida per un ravvicinato: tocca lo schermo per mettere a fuoco.' });
  if (r - b > 60) avvisi.push({ t: 'Luce calda: i rossori risultano falsati. Meglio luce bianca o naturale.' });
  if (b - r > 30) avvisi.push({ t: 'Luce fredda o bluastra: il colorito risulta spento.' });
  if (slot.area === 'viso' && Math.abs(sx - dx) > 45) avvisi.push({ t: 'Luce da un lato solo: le ombre sembrano rughe e cedimenti. Mettiti di fronte alla luce.' });
  return { luma: Math.round(luma), nitidezza: Math.round(nitidezza), dominante: Math.round(r - b), avvisi, grave: avvisi.some(a => a.grave) };
}

function campo(d, r, set) {
  const q = el('div', { class: 'q' });
  q.append(el('label', { class: 't' }, d.testo, d.obbligatoria ? el('span', { class: 'req' }, ' *') : null));
  const v = r[d.id];
  if (d.tipo === 'testo' || d.tipo === 'numero') {
    q.append(el('input', { type: d.tipo === 'numero' ? 'number' : 'text', value: v ?? '', min: d.min, max: d.max, step: d.passo, inputmode: d.tipo === 'numero' ? 'decimal' : null, oninput: e => set(d.id, d.tipo === 'numero' ? (e.target.value === '' ? '' : Number(e.target.value)) : e.target.value) }));
  } else if (d.tipo === 'testo_lungo') {
    q.append(el('textarea', { oninput: e => set(d.id, e.target.value) }, v ?? ''));
  } else if (d.tipo === 'si_no') {
    const seg = el('div', { class: 'seg' });
    const b = (lab, val) => el('button', { type: 'button', class: v === val ? 'on' : '', onclick: () => { set(d.id, val); seg.querySelectorAll('button').forEach((x, i) => x.classList.toggle('on', (i === 0) === val)); if (d.dettaglio) q.querySelector('.dett')?.classList.toggle('nascosto', !val); } }, lab);
    seg.append(b('Sì', true), b('No', false));
    q.append(seg);
    if (d.dettaglio) q.append(el('input', { class: 'dett', type: 'text', placeholder: d.dettaglio, value: r[d.id + '_dettaglio'] ?? '', style: 'margin-top:8px', oninput: e => set(d.id + '_dettaglio', e.target.value) }));
  } else if (d.tipo === 'scelta') {
    const opz = d.opzioni_frequenza ? S.an.opzioni_frequenza : d.opzioni;
    if (opz.length <= 4 && opz.every(o => o.t.length < 24)) {
      const seg = el('div', { class: 'seg' });
      for (const o of opz) seg.append(el('button', { type: 'button', class: v === o.v ? 'on' : '', onclick: e => { set(d.id, o.v); seg.querySelectorAll('button').forEach(x => x.classList.remove('on')); e.currentTarget.classList.add('on'); } }, o.t));
      q.append(seg);
    } else {
      const sel = el('select', { onchange: e => set(d.id, e.target.value) }, el('option', { value: '' }, '—'));
      for (const o of opz) sel.append(el('option', { value: o.v, selected: v === o.v }, o.t));
      q.append(sel);
    }
  } else if (d.tipo === 'multipla') {
    let opz = d.opzioni;
    if (d.opzioni_da) { const area = d.opzioni_da.split('_')[1]; opz = Object.entries(S.kb.inestetismi).filter(([, i]) => i.area === area).map(([id, i]) => ({ v: id, t: i.nome })); }
    const sel = new Set(Array.isArray(v) ? v : []);
    const chips = el('div', { class: 'chips' });
    for (const o of opz) chips.append(el('button', { type: 'button', class: 'chip' + (sel.has(o.v) ? ' on' : ''), onclick: e => { sel.has(o.v) ? sel.delete(o.v) : sel.add(o.v); e.currentTarget.classList.toggle('on'); set(d.id, [...sel]); } }, o.t));
    q.append(chips);
  } else if (d.tipo === 'scala') {
    const sc = el('div', { class: 'scala' });
    for (let i = d.min; i <= d.max; i++) sc.append(el('button', { type: 'button', class: v === i ? 'on' : '', onclick: e => { set(d.id, i); sc.querySelectorAll('button').forEach(x => x.classList.remove('on')); e.currentTarget.classList.add('on'); } }, i));
    q.append(sc);
  }
  return q;
}

/* ---------- 2. foto ---------- */
function stepFoto() {
  const s = S.scheda, wrap = el('div');
  s.storico = s.storico || [];
  if (s.risposte.consenso_foto !== true) wrap.append(el('div', { class: 'alert warn' }, el('b', {}, 'Manca il consenso alle foto'), 'Compila la sezione “Consenso” dell’anamnesi prima di scattare.'));
  wrap.append(el('div', { class: 'alert info' }, el('b', {}, 'Protocollo di scatto'), 'Fotocamera posteriore, effetto bellezza spento, niente modalità ritratto. Luce diffusa di fronte, mai faretti dall’alto. Un foglio bianco nell’angolo dell’inquadratura aiuta a leggere i colori. Stessa stanza, stessa distanza, stessa ora per ogni controllo: la foto precedente appare in trasparenza per rimettersi in posizione.'));
  const nFoto = Object.keys(s.foto).length;
  const gravi = Object.entries(s.foto).filter(([, f]) => f.qualita?.grave).length;
  if (gravi) wrap.append(el('div', { class: 'alert danger' }, el('b', {}, gravi + (gravi === 1 ? ' foto da rifare' : ' foto da rifare')), 'Il controllo di qualità ha trovato problemi seri: la lettura automatica darebbe risultati inaffidabili.'));

    card.append(grid); wrap.append(card);
  }
  const ctrl = el('div', { class: 'card' }, el('h2', {}, 'Controlli nel tempo'));
  ctrl.append(el('p', { class: 'small muted' }, 'Quando la cliente torna per il controllo fotografico, archivia le foto attuali: restano come “prima” e i riquadri si liberano per le nuove.'));
  ctrl.append(el('div', { class: 'row' },
    el('button', { class: 'btn', disabled: !nFoto, onclick: () => { if (!confirm('Archiviare le ' + nFoto + ' foto attuali come controllo del ' + dataIt(new Date().toISOString()) + '?')) return; s.storico.push({ data: new Date().toISOString(), foto: s.foto }); s.foto = {}; salva(); render(); } }, 'Archivia e nuovo controllo'),
    el('span', { class: 'small muted' }, s.storico.length ? s.storico.length + (s.storico.length === 1 ? ' controllo archiviato' : ' controlli archiviati') + ', ultimo del ' + dataIt(s.storico[s.storico.length - 1].data) : 'Nessun controllo archiviato.')));
  if (s.storico.length) {
    const prima = s.storico[s.storico.length - 1];
    const coppie = SLOT_FOTO.filter(sl => prima.foto[sl.id] && s.foto[sl.id]);
    if (coppie.length) {
      ctrl.append(el('h3', { style: 'margin-top:14px' }, 'Prima e dopo'));
      for (const sl of coppie) ctrl.append(el('div', { style: 'margin-bottom:10px' }, el('div', { class: 'small', style: 'font-weight:600' }, sl.nome), el('div', { class: 'confronto' }, el('figure', {}, el('img', { src: prima.foto[sl.id].dataUrl }), el('figcaption', {}, 'prima · ', dataIt(prima.data))), el('figure', {}, el('img', { src: s.foto[sl.id].dataUrl }), el('figcaption', {}, 'dopo · ', dataIt(s.foto[sl.id].data))))));
    }
  }
  wrap.append(ctrl);
  return wrap;
}

function fotoPrecedente(slotId) {
  const s = S.scheda;
  if (s.foto[slotId]) return s.foto[slotId];
  for (let i = (s.storico || []).length - 1; i >= 0; i--) if (s.storico[i].foto[slotId]) return s.storico[i].foto[slotId];
  return null;
}

async function salvaFoto(slot, sorgente) {
  const r = await ridimensiona(sorgente, slot.max);
  const qualita = valutaFoto(r.canvas, slot);
  S.scheda.foto[slot.id] = { dataUrl: r.dataUrl, w: r.w, h: r.h, data: new Date().toISOString(), qualita: { luma: qualita.luma, nitidezza: qualita.nitidezza, dominante: qualita.dominante, grave: qualita.grave, avvisi: qualita.avvisi.map(a => a.t) } };
  salva();
  return qualita;
}

function slotFoto(slot) {
  const s = S.scheda, f = s.foto[slot.id];
  const box = el('div', { class: 'foto-slot' + (f?.qualita?.grave ? ' grave' : '') });
  const input = el('input', { type: 'file', accept: 'image/*', onchange: async e => { const file = e.target.files[0]; if (!file) return; try { const q = await salvaFoto(slot, file); toast(q.grave ? 'Foto salvata, ma da rifare' : q.avvisi.length ? 'Foto salvata con avvisi' : 'Foto salvata'); render(); } catch (err) { toast('Foto non leggibile: ' + err.message); } } });
  if (f) {
    box.append(el('img', { src: f.dataUrl, alt: slot.nome }));
    box.append(el('button', { class: 'btn sm x', onclick: () => { delete s.foto[slot.id]; salva(); render(); } }, '✕'));
  } else {
    box.append(el('div', { class: 'ph', onclick: () => apriCamera(slot) }, el('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>' }), 'Tocca per scattare'));
  }
  box.append(el('div', { class: 'lab' }, slot.nome, slot.facoltativa ? el('span', { class: 'muted small' }, ' · facoltativa') : null), el('div', { class: 'guida' }, slot.guida), input);
  if (f?.qualita?.avvisi?.length) box.append(el('ul', { class: 'avvisi' + (f.qualita.grave ? ' grave' : '') }, f.qualita.avvisi.map(a => el('li', {}, a))));
  else if (f) box.append(el('div', { class: 'small', style: 'color:var(--ok);margin-top:6px' }, 'Luce e nitidezza a posto'));
  const prec = !f && fotoPrecedente(slot.id);
  if (prec) box.append(el('div', { class: 'small muted', style: 'margin-top:6px' }, 'Precedente del ', dataIt(prec.data), ' disponibile in trasparenza.'));
  box.append(el('div', { class: 'row', style: 'justify-content:center;margin-top:8px' },
    el('button', { class: 'btn sm', onclick: () => apriCamera(slot) }, f ? 'Rifai' : 'Fotocamera'),
    el('button', { class: 'btn sm', onclick: () => input.click() }, 'Galleria')));
  return box;
}

/* ---------- fotocamera guidata ---------- */
const SAGOME = {
  ovale: `<ellipse cx="150" cy="200" rx="98" ry="135"/><line x1="52" y1="170" x2="248" y2="170" stroke-dasharray="4 6"/><text x="150" y="360">occhi sulla linea · viso dentro l’ovale</text>`,
  profilo: `<ellipse cx="160" cy="200" rx="88" ry="135"/><line x1="30" y1="200" x2="270" y2="200" stroke-dasharray="4 6"/><text x="150" y="360">sguardo all’orizzonte · orecchio visibile</text>`,
  dettaglio: `<rect x="45" y="110" width="210" height="180" rx="16"/><text x="150" y="330">riempi il riquadro · a fuoco</text>`,
  corpo: `<circle cx="150" cy="48" r="20"/><path d="M110 80 Q150 70 190 80 L200 190 L185 190 L180 380 L158 380 L152 240 L148 240 L142 380 L120 380 L115 190 L100 190 Z"/><line x1="60" y1="384" x2="240" y2="384"/><text x="150" y="398">piedi sulla linea · telefono dritto</text>`,
  corpo_lato: `<circle cx="150" cy="48" r="20"/><path d="M128 80 Q150 72 172 80 L178 200 L170 200 L166 380 L134 380 L130 200 L122 200 Z"/><line x1="60" y1="384" x2="240" y2="384"/><text x="150" y="398">piedi sulla linea · postura naturale</text>`
};
let cam = { stream: null, slot: null, facing: 'environment', frame: null };

async function apriCamera(slot) {
  cam.slot = slot; cam.frame = null;
  const dlg = $('#dlg-camera');
  $('#cam-titolo').textContent = slot.nome;
  $('#cam-guida').textContent = slot.guida;
  $('#cam-sagoma').innerHTML = SAGOME[slot.sagoma] || '';
  const prec = fotoPrecedente(slot.id);
  const ghost = $('#cam-ghost'); ghost.src = prec ? prec.dataUrl : ''; ghost.style.display = prec ? 'block' : 'none';
  $('#cam-ghost-ctrl').style.display = prec ? 'flex' : 'none';
  $('#cam-anteprima').style.display = 'none'; $('#cam-live').style.display = 'block';
  $('#cam-avvisi').innerHTML = '';
  dlg.showModal();
  try { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch {}
  await avviaStream();
}

async function avviaStream() {
  fermaStream();
  const video = $('#cam-video');
  if (!navigator.mediaDevices?.getUserMedia) { $('#cam-avvisi').innerHTML = '<div class="alert warn">Fotocamera non disponibile in questo browser: usa “Galleria”.</div>'; return; }
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: cam.facing }, width: { ideal: 4096 }, height: { ideal: 3072 } } });
    video.srcObject = cam.stream; video.classList.toggle('specchio', cam.facing === 'user'); await video.play();
    const st = cam.stream.getVideoTracks()[0].getSettings();
    $('#cam-info').textContent = (st.width && st.height ? st.width + '×' + st.height : '') + (cam.facing === 'user' ? ' · frontale: attenzione agli effetti bellezza' : '');
  } catch (e) { $('#cam-avvisi').innerHTML = '<div class="alert warn">Non riesco ad aprire la fotocamera (' + esc(e.message) + '). Usa “Galleria”.</div>'; }
}
function fermaStream() { if (cam.stream) { cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; } }

async function scatta() {
  if (!cam.stream) return;
  const video = $('#cam-video'); const track = cam.stream.getVideoTracks()[0];
  let bmp = null;
  if ('ImageCapture' in window) { try { const blob = await new ImageCapture(track).takePhoto(); bmp = await createImageBitmap(blob); } catch {} }

function applicaEsame() {
  const L = S.scheda.lettura; L.esame = L.esame || {};
  const voluti = new Map(); const segnala = new Set();
  for (const prova of S.es.prove) {
    const o = prova.opzioni.find(x => x.id === L.esame[prova.id]); if (!o) continue;
    for (const f of o.effetti) voluti.set(f.inestetismo, Math.max(voluti.get(f.inestetismo) || 0, f.grado));
    if (o.segnala) segnala.add(o.segnala);
  }
  L.inestetismi = L.inestetismi.filter(i => !(i.fonte === 'tatto' && !voluti.has(i.id)));
  for (const i of L.inestetismi) i.tatto = voluti.has(i.id);
  for (const [id, grado] of voluti) {
    const ex = L.inestetismi.find(i => i.id === id);
    if (ex) { ex.grado = Math.max(ex.grado || 1, grado); ex.attivo = true; }
    else L.inestetismi.push({ id, grado, zone: [], fonte: 'tatto', tatto: true, attivo: true });
  }
  L.segnalazioni = (L.segnalazioni || []).filter(x => !(x.fonte === 'tatto' && !segnala.has(x.id)));
  for (const id of segnala) if (!L.segnalazioni.some(x => x.id === id)) L.segnalazioni.push({ id, fonte: 'tatto', motivo: 'rilevato all’esame al tatto' });
}

async function analizza() {

    }
    const catalogo = {
      inestetismi: Object.entries(S.kb.inestetismi).map(([id, d]) => ({ id, nome: d.nome, area: d.area, segni: d.segni, zone_tipiche: d.zone_tipiche })),
      zone: S.kb.zone,
      segnalazioni: S.kb.segnalazioni_medico.map(x => ({ id: x.id, nome: x.nome }))

    const r = s.risposte;
    const contesto = { eta: r.eta, fototipo_dichiarato: r.fototipo, pelle_percepita: r.pelle_percepita, obiettivi: [...(r.obiettivi_viso || []), ...(r.obiettivi_corpo || [])], note: r.obiettivo_libero || '' };
    const res = await fetch(cfg.url.replace(/\/$/, '') + '/analizza', { method: 'POST', headers: { 'content-type': 'application/json', ...(cfg.token ? { authorization: 'Bearer ' + cfg.token } : {}) }, body: JSON.stringify({ foto, contesto, catalogo }) });
    if (!res.ok) throw new Error('worker ' + res.status + ': ' + (await res.text()).slice(0, 200));
    const ai = await res.json();
    s.lettura.ai = { ...ai, data: new Date().toISOString() };
    // unisce: tiene i manuali, sostituisce i precedenti da AI
    const manuali = s.lettura.inestetismi.filter(i => i.fonte !== 'ai');
    const nuovi = (ai.inestetismi || []).filter(i => S.kb.inestetismi[i.id] && !manuali.some(m => m.id === i.id)).map(i => ({ id: i.id, grado: Math.min(3, Math.max(1, Number(i.grado) || 2)), zone: (i.zone || []).filter(z => S.kb.zone[S.kb.inestetismi[i.id].area].includes(z)), fonte: 'ai', confidenza: i.confidenza, evidenza: i.evidenza, attivo: i.confidenza !== 'bassa' }));
    s.lettura.inestetismi = [...nuovi, ...manuali];

}

    }
    det.append(body); c.append(det);
  });

  c.append(el('h3', { style: 'margin-top:16px' }, 'Prodotti e principi attivi per casa'));
  const at = el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Attivo'), el('th', {}, 'Azione'), el('th', {}, 'Quando'))));
  const atb = el('tbody');
  for (const a of p.attivi) atb.append(el('tr', {}, el('td', {}, el('strong', {}, a.nome)), el('td', { class: 'small' }, a.azione, a.cautela ? el('div', { style: 'color:var(--warn)' }, 'Cautela: ' + a.cautela) : null), el('td', { class: 'small muted' }, a.quando)));
  at.append(atb); c.append(at);
  if (p.attivi_evitati.length) c.append(el('p', { class: 'small muted', style: 'margin-top:8px' }, el('strong', {}, 'Da evitare in questo percorso: '), p.attivi_evitati.map(a => a.nome).join(', '), '.'));

  c.append(el('h3', { style: 'margin-top:16px' }, 'Consigli per casa'));
  c.append(el('ul', { style: 'padding-left:18px;margin:0' }, p.casa.map(x => el('li', {}, x))));
  return c;
}

function esporta(s) {
  const copia = { ...s, foto: Object.fromEntries(Object.entries(s.foto).map(([k, f]) => [k, { w: f.w, h: f.h, data: f.data }])) };
  const blob = new Blob([JSON.stringify(copia, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: 'scheda-' + (s.risposte.nome || s.id).replace(/\s+/g, '-').toLowerCase() + '.json' });
  document.body.append(a); a.click(); a.remove();
}

/* ---------- impostazioni ---------- */
const dlg = $('#dlg-impostazioni');
$('#btn-impostazioni').onclick = () => { const c = imp(); $('#imp-url').value = c.url || ''; $('#imp-token').value = c.token || ''; $('#imp-centro').value = c.centro || ''; dlg.showModal(); };
$('#imp-chiudi').onclick = () => dlg.close();
$('#imp-salva').onclick = () => { localStorage.setItem('estetica.impostazioni', JSON.stringify({ url: $('#imp-url').value.trim(), token: $('#imp-token').value.trim(), centro: $('#imp-centro').value.trim() })); dlg.close(); toast('Impostazioni salvate'); render(); };
$('#btn-elenco').onclick = async () => { S.schede = await db.tutte(); S.vista = 'elenco'; render(); };
$('#btn-nuova').onclick = nuova;

/* ---------- avvio ---------- */
(async () => {
  try {
    [S.kb, S.an, S.es] = await Promise.all([fetch('conoscenza.json').then(r => r.json()), fetch('anamnesi.json').then(r => r.json()), fetch('esame.json').then(r => r.json())]);
    S.schede = await db.tutte();
    render();
  } catch (e) { $('#app').innerHTML = '<div class="alert danger"><b>Impossibile avviare</b>' + esc(e.message) + '. La pagina va aperta da un server web, non come file locale.</div>'; }
})();
