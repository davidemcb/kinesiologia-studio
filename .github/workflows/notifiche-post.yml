name: Notifiche dei post programmati

# Ogni ora guarda i post dell'app che devono ancora uscire e affida a
# OneSignal la loro notifica (un'ora dopo la comparsa del post). Cosi' un post
# caricato su Firestore con data futura arriva sui telefoni senza fare niente
# a mano e senza tenere acceso il computer.
# Serve il segreto ONESIGNAL_REST_KEY (la chiave REST dell'app OneSignal).
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  group: notifiche-post
  cancel-in-progress: false

jobs:
  programma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Programma le notifiche che mancano
        env:
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: python3 -I scripts/programma_notifiche.py
