name: Diagnosi delle notifiche

# Si lancia a mano (Actions > Diagnosi delle notifiche > Run workflow) quando
# qualcuno dice «non mi arrivano le notifiche»: stampa cosa vede OneSignal,
# cioe' a quanti telefoni e' stata consegnata ogni notifica e quanti telefoni
# risultano davvero iscritti, per piattaforma. Non manda niente.
# Serve il segreto ONESIGNAL_REST_KEY, lo stesso di notifiche-post.yml.
on:
  workflow_dispatch:

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cosa vede OneSignal
        env:
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: python3 -I scripts/diagnosi_notifiche.py
